name: Release

on:
  push:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - run: deno task check
      - run: deno task build
      - run: deno test scripts/

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
        working-directory: src-tauri

      - name: Compute version
        id: version
        run: |
          VERSION=$(deno run --allow-read scripts/ci_version.ts --dry-run)
          APP_VERSION=$(echo "$VERSION" | grep "^APP_VERSION=" | cut -d= -f2)
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: Deploy
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg,app"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Compute version
        run: deno run --allow-read --allow-write --allow-env scripts/ci_version.ts

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: "deno task tauri"
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Diavola ${{ env.RELEASE_VERSION }}
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Package raw binary (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find src-tauri/target -path "*/release/diavola" -maxdepth 4 -type f | head -1)
          gzip -c "$BIN" > diavola-linux-amd64.gz

      - name: Package raw binary (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find src-tauri/target -path "*/release/bundle/macos/Diavola.app" | head -1)
          tar -czf diavola-darwin-arm64.tar.gz -C "$(dirname "$APP")" Diavola.app

      - name: Package raw binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $BIN = Get-ChildItem -Path src-tauri/target -Recurse -Filter diavola.exe | Where-Object { $_.FullName -like "*\release\*" } | Select-Object -First 1
          Copy-Item $BIN.FullName diavola-windows-amd64.exe

      - name: Upload raw binary to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            ASSET="diavola-linux-amd64.gz"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ASSET="diavola-darwin-arm64.tar.gz"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="diavola-windows-amd64.exe"
          fi
          gh release upload "$RELEASE_TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  npm-publish:
    needs: [release, check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set version in package.json
        run: npm version "${{ needs.check.outputs.app_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public
