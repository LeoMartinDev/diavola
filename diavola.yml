logTimestampPattern: "^\\[\\d{2}:\\d{2}:\\d{2}\\]"

processes:
  setup:
    kind: task
    env:
      EXAMPLE_ENV: "hello-from-diavola"
    cmd: |
      deno eval 'console.log("setup complete:", Deno.env.get("EXAMPLE_ENV"))'

  api:
    kind: service
    cmd: |
      deno eval 'console.log("api listening on http://127.0.0.1:3999"); setInterval(() => console.log("api tick", new Date().toISOString()), 200)'
    dependsOn:
      setup: success
    ready:
      type: log
      pattern: "api listening"
      regex: false
      timeoutMs: 10000

  worker:
    kind: service
    cmd: |
      deno eval 'console.log("worker ready"); setInterval(() => console.log("worker tick", new Date().toISOString()), 2000)'
    dependsOn:
      api: ready
    ready:
      type: delay
      durationMs: 500

  multi-line-demo:
    kind: service
    cmd: |
      deno eval '
      setTimeout(() => {
        console.log("[12:00:01] INFO  Starting application...");
        console.log("  Initializing database connection pool");
        console.log("  Loading configuration from /etc/app/config.yml");
        console.log("  Registering 3 middleware handlers");
        console.log("  Server listening on 0.0.0.0:3000");
        console.log("[12:00:02] INFO  Application started successfully");
        console.log("[12:00:03] WARN  Slow query detected (452ms)");
        console.log("  SELECT * FROM users WHERE status = active");
        console.log("  Query plan: Seq Scan on users (cost=0.00..153.24 rows=524 width=128)");
        console.log("[12:00:04] ERROR Unhandled exception in worker thread");
        console.log("  Error: Connection refused");
        console.log("      at Socket.connect (net.ts:142:15)");
        console.log("      at Database.connect (db.ts:89:22)");
        console.log("      at App.start (app.ts:45:10)");
        console.log("      at main (index.ts:12:3)");
        console.log("[12:00:05] FATAL Process exited with code 1");
        console.log("  Stack trace:");
        console.log("  ─────────────────────────────────");
        console.log("  AppError: Failed to initialize");
        console.log("    at bootstrap (main.ts:23)");
        console.log("    at Object.<anonymous> (main.ts:5)");
        console.log("  ─────────────────────────────────");
        console.log("[12:00:06] INFO  multi-line demo complete");
      }, 2000);
      setInterval(() => {}, 99999);
      '
    dependsOn:
      logs-colores: ready
    ready:
      type: log
      pattern: "multi-line demo complete"
      regex: false
      timeoutMs: 10000

  logs-colores:
    kind: service
    cmd: |
      deno eval '
      const c = {
        reset: "\x1b[0m",
        bold: "\x1b[1m",
        dim: "\x1b[2m",
        italic: "\x1b[3m",
        underline: "\x1b[4m",
        inverse: "\x1b[7m",
        red: "\x1b[31m",
        green: "\x1b[32m",
        yellow: "\x1b[33m",
        blue: "\x1b[34m",
        magenta: "\x1b[35m",
        cyan: "\x1b[36m",
        white: "\x1b[37m",
        bgRed: "\x1b[41m",
        bgGreen: "\x1b[42m",
        bgBlue: "\x1b[44m",
        brightRed: "\x1b[91m",
        brightGreen: "\x1b[92m",
        brightYellow: "\x1b[93m",
      };
      const log = (level, color, msg) => {
        const ts = new Date().toISOString().slice(11, 23);
        console.log(`${c.dim}[${ts}]${c.reset} ${color}${level}${c.reset} ${msg}`);
      };
      log("INFO ", c.green,  "Starting color demo");
      log("WARN ", c.yellow, "Ceci est un avertissement");
      log("ERROR", c.red,    "Fausse erreur pour test");
      log("DEBUG", c.cyan,   "Valeur: 42, flag: true");
      log("TRACE", c.dim,    "Entrée dans la fonction process()");
      log("FATAL", `${c.bold}${c.bgRed}${c.white}`, "Ceci est fatal (simulé)" + c.reset);
      log("INFO ", `${c.bold}${c.green}`, "Gras + vert");
      log("WARN ", `${c.italic}${c.yellow}`, "Texte en italique sur fond bleu" + c.reset);
      log("SQL  ", `${c.inverse}${c.magenta}`, " mode inverse ");
      log("HTTP ", c.brightGreen, "GET /api/users 200 OK");
      log("HTTP ", c.brightRed,  "POST /api/login 401 Unauthorized");
      log("BUILD", c.brightYellow, "Compilation terminée en 3.2s");
      log("TEST ", `${c.yellow}${c.underline}`, "/tests/fail  FAIL  expected true got false" + c.reset);
      log("INFO ", c.green,  "Demo terminée, bon test !");
      setInterval(() => {}, 99999);
      '
    dependsOn:
      api: ready
    ready:
      type: log
      pattern: "Demo termin"
      regex: false
      timeoutMs: 10000
